<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="only light">
<title>부적합 처리 요청</title>
<!-- 앱으로 설치 (홈 화면 아이콘) -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f6f8fa">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="부적합 요청">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --empty:#fbdcd7; --empty-bd:#e9bfb8; --bg:#ffffff; --bg2:#f6f8fa; --bd:#d0d7de; --bd2:#d8dee4; --fg:#1f2328; --mut:#59636e;
  --acc:#0969da; --acc-bg:#ddf4ff; --ok:#1a7f37; --ok-bg:#dafbe1; --btn:#1f883d; --btn-h:#1a7f37;
  --warn:#9a6700; --warn-bg:#fff8c5; --err:#d1242f; --err-bg:#ffebe9; --sh:0 1px 0 rgba(31,35,40,.04);
}
html{color-scheme:only light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Malgun Gothic",Helvetica,Arial,sans-serif}
.inst{display:none;max-width:680px;margin:10px auto 0;padding:8px 12px;border:1px solid var(--acc);background:var(--acc-bg);color:var(--fg);border-radius:6px;font-size:13px;align-items:center;gap:8px}
.inst.on{display:flex} .inst b{color:var(--acc)} .inst .sp{flex:1}
.inst button{font:inherit;border:1px solid var(--bd);background:var(--bg);border-radius:6px;padding:3px 10px;cursor:pointer}
.inst button.go{background:var(--btn);border-color:var(--btn);color:#fff;font-weight:600}
header{background:var(--bg2);border-bottom:1px solid var(--bd);padding:12px 16px}
.hwrap{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-weight:600;font-size:16px;display:flex;align-items:center;gap:8px}
.logo .wm{height:18px;width:auto;display:block}
.logo .lsep{width:1px;height:16px;background:var(--bd);margin:0 2px}
.status{margin-left:auto;font-size:12px;color:var(--mut);display:flex;gap:6px;flex-wrap:wrap}
.pill{border:1px solid var(--bd);border-radius:2em;padding:0 8px;background:var(--bg)}
.pill.ok{color:var(--ok);border-color:var(--ok)} .pill.err{color:var(--err);border-color:var(--err)}
main{max-width:680px;margin:0 auto;padding:16px}
.box{border:1px solid var(--bd);border-radius:6px;background:var(--bg);box-shadow:var(--sh);margin-bottom:16px}
.box-h{background:var(--bg2);border-bottom:1px solid var(--bd);padding:8px 12px;border-radius:6px 6px 0 0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.box-h h2{font-size:14px;margin:0;font-weight:600}
.box-b{padding:12px}
textarea,input{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:6px 8px;width:100%}
textarea{resize:vertical;min-height:64px}
textarea:focus,input:focus{outline:2px solid var(--acc);outline-offset:-1px;border-color:var(--acc)}
input.need,textarea.need{background:var(--empty);border-color:var(--empty-bd)}
input.need::placeholder,textarea.need::placeholder{color:#8a4a40}
.btn{font:inherit;font-weight:500;border:1px solid var(--bd);background:var(--bg2);color:var(--fg);border-radius:6px;padding:6px 14px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{border-color:var(--mut)}
.btn.pri{background:var(--btn);border-color:rgba(31,35,40,.15);color:#fff}
.btn.pri:hover{background:var(--btn-h)}
.btn.sm{padding:2px 10px;font-size:12px}
.btn[disabled]{opacity:.55;cursor:default}
.mut{color:var(--mut);font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pick .btn{padding:12px 10px;font-size:15px}
.shot{display:none;margin-top:12px;gap:12px;align-items:flex-start}
.shot img{width:96px;height:96px;object-fit:cover;border:1px solid var(--bd);border-radius:6px;background:var(--bg2);flex:none}
.prog{flex:1;min-width:0}
.prog .t{font-size:13px;font-weight:600}
.bar{height:6px;background:var(--bg2);border:1px solid var(--bd2);border-radius:3px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
.f{margin-bottom:10px}
.f label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);font-weight:600;margin-bottom:3px}
.f label .no{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:var(--bg2);border:1px solid var(--bd);font-size:11px;color:var(--fg)}
.tag{font-size:11px;border-radius:2em;padding:0 7px;font-weight:600}
.tag.auto{background:var(--ok-bg);color:var(--ok)} .tag.chk{background:var(--warn-bg);color:var(--warn)} .tag.learn{background:#ddf4ff;color:#0969da}
.hint{font-size:12px;color:var(--mut);margin-top:3px;min-height:0}
.hint.w{color:var(--warn)}
.cands{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{font:inherit;font-size:12px;border:1px solid var(--bd);border-radius:2em;padding:3px 10px;background:var(--bg2);cursor:pointer;color:var(--fg);text-align:left}
.chip:hover{border-color:var(--acc)}
.chip small{color:var(--mut);margin-left:4px}
.ask{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
.btn.askb.on{background:var(--warn-bg);border-color:var(--warn);color:var(--warn);font-weight:600}
.btn.askb.on::before{content:'✓ '}
.qty{display:flex;align-items:center;gap:6px}
.qty input{max-width:120px}
.qty span{color:var(--mut);font-size:13px;font-weight:600}
.combo{position:relative}
.dd{position:absolute;z-index:20;left:0;right:0;top:100%;margin-top:2px;background:var(--bg);border:1px solid var(--bd);border-radius:6px;box-shadow:0 8px 24px rgba(66,74,83,.2);max-height:260px;overflow:auto;display:none}
.dd div{padding:7px 10px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.dd div small{color:var(--mut);text-align:right}
.dd div:hover,.dd div.act{background:var(--acc-bg)}
.out pre{margin:0;background:var(--bg2);border:1px solid var(--bd2);border-radius:6px;padding:10px 12px;white-space:pre-wrap;word-break:break-all;font:14px/1.7 ui-monospace,SFMono-Regular,Menlo,Consolas,"Noto Sans KR",monospace;min-height:110px}
.out .btn.pri{width:100%;margin-top:10px;padding:12px;font-size:16px}
.warn{font-size:12px;color:var(--warn);background:var(--warn-bg);border-radius:6px;padding:4px 8px;margin:8px 0 0}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:6px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.on{opacity:1}
@media (max-width:760px){ input,textarea{font-size:16px} .status{margin-left:0;width:100%} .logo{font-size:15px;gap:6px} .logo .wm{height:13px} .logo .lsep{height:13px} }
</style>
</head>
<body>
<header><div class="hwrap">
  <div class="logo"><img class="wm" src="ninebell-logo.png" alt="NINEBELL"><span class="lsep" aria-hidden="true"></span>부적합 처리 요청</div>
  <div class="status" id="status"></div>
</div>
<div class="inst" id="inst"><span class="sp" id="instT"></span><button class="go" type="button" id="instGo" hidden>설치</button><button type="button" id="instX" aria-label="닫기">닫기</button></div>
</header>
<main>
  <section class="box">
    <div class="box-h"><h2>라벨·도면 사진</h2><span class="mut">사진을 올리면 아래 칸이 자동으로 채워져요</span></div>
    <div class="box-b">
      <div class="pick">
        <button class="btn pri" id="bCam" type="button">
          <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M5.5 2 4.6 3.5H2.75A1.75 1.75 0 0 0 1 5.25v7A1.75 1.75 0 0 0 2.75 14h10.5A1.75 1.75 0 0 0 15 12.25v-7a1.75 1.75 0 0 0-1.75-1.75H11.4L10.5 2h-5ZM8 5.5a3 3 0 1 1 0 6 3 3 0 0 1 0-6Zm0 1.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Z"/></svg>사진 찍기</button>
        <button class="btn" id="bAlb" type="button">
          <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M1.75 2h12.5c.966 0 1.75.784 1.75 1.75v8.5A1.75 1.75 0 0 1 14.25 14H1.75A1.75 1.75 0 0 1 0 12.25v-8.5C0 2.784.784 2 1.75 2Zm0 1.5a.25.25 0 0 0-.25.25v6.69l2.97-2.97a.75.75 0 0 1 1.06 0l2.22 2.22 3.22-3.22a.75.75 0 0 1 1.06 0l2.47 2.47V3.75a.25.25 0 0 0-.25-.25ZM5 6.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Z"/></svg>앨범에서 선택</button>
      </div>
      <input type="file" id="fCam" accept="image/*" capture="environment" hidden>
      <input type="file" id="fAlb" accept="image/*" hidden>
      <div class="shot" id="shot">
        <img id="thumb" alt="올린 사진">
        <div class="prog">
          <div class="t" id="pT">읽는 중…</div>
          <div class="bar"><i id="pB"></i></div>
          <div class="mut" id="pM"></div>
        </div>
      </div>
    </div>
  </section>

  <section class="box">
    <div class="box-h"><h2>입력</h2><span class="mut">사진이 없으면 직접 입력해도 돼요</span><button class="btn sm" id="bNew" type="button" style="margin-left:auto">새로 작성</button></div>
    <div class="box-b">
      <div class="f">
        <label for="iProj"><span class="no">1</span>프로젝트명 <span class="tag" id="tProj"></span></label>
        <div class="combo"><input id="iProj" autocomplete="off" placeholder="입력 필요"><div class="dd" id="dProj"></div></div>
        <div class="hint" id="hProj"></div>
        <div class="cands" id="cProj"></div>
      </div>
      <div class="f">
        <label for="iPn"><span class="no">2</span>품번 <span class="tag" id="tPn"></span></label>
        <div class="combo"><input id="iPn" autocomplete="off" autocapitalize="characters" placeholder="입력 필요"><div class="dd" id="dPn"></div></div>
        <div class="hint" id="hPn"></div>
        <div class="cands" id="cPn"></div>
      </div>
      <div class="f">
        <label for="iQty"><span class="no">3</span>수량 <span class="tag" id="tQty"></span></label>
        <div class="qty"><input id="iQty" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="입력 필요"><span>EA</span></div>
      </div>
      <div class="f">
        <label for="iTxt"><span class="no">4</span>불량내용</label>
        <textarea id="iTxt" rows="2" placeholder="입력 필요 (예: 탭 누락)"></textarea>
      </div>
      <div class="f">
        <label for="iVen"><span class="no">5</span>귀책 <span class="tag" id="tVen"></span></label>
        <div class="combo"><input id="iVen" autocomplete="off" placeholder="입력 필요 · 업체명 초성 검색 (예: ㅇㅍ)"><div class="dd" id="dVen"></div></div>
        <div class="hint" id="hVen"></div>
        <div class="ask"><button class="btn sm askb" id="bAsk" type="button">확인요청</button><span class="mut">귀책 확인이 필요한 경우 클릭</span></div>
      </div>
      <div class="f">
        <label for="iReq"><span class="no">6</span>요청자 <span class="tag" id="tReq"></span></label>
        <div class="combo"><input id="iReq" autocomplete="off" placeholder="입력 필요 · 초성 검색 (예: ㄱㅅㅂ)"><div class="dd" id="dReq"></div></div>
        <div class="hint" id="hReq"></div>
      </div>
    </div>
  </section>

  <section class="box out">
    <div class="box-h"><h2>메시지</h2><span class="mut">복사해서 '부적합 처리요청' 방에 붙여넣기</span></div>
    <div class="box-b">
      <pre id="out"></pre>
      <div class="warn" id="wOut" style="display:none"></div>
      <button class="btn pri" id="bCopy" type="button">복사</button>
    </div>
  </section>
</main>
<div class="toast" id="toast"></div>

<script>
/* ================== 설정 (여기만 고치면 됨) ================== */
const CONFIG = {
  SHEET_ID: '1hWRxLYkJfPEBfItSNKv7IFuSOFcLI35b9jCHnKVRBtE',
  // 시트 찾는 순서: ① 올해 연도 이름 → ② 시트 고유번호(gid) → ③ 작년 연도 이름 (제목 줄로 내용 확인 후 사용)
  REF:   { names: y=>[`참조(${y})`,`참조 (${y})`], gid: '664632288', range: 'AD1:AF3000' },             // 귀책(6.3)
  PROJ:  { names: y=>[`참조(${y})`,`참조 (${y})`], gid: '664632288', range: 'L1:M5000', merge: true },  // 프로젝트 발주명, 올해+작년 합침
  PARTS: { gid: '1577658176', range: 'A:L' },   // 품명/품번 시트: 품번·품명·발견자(요청자). 행 수 제한 없이 끝까지 읽음 (2026-10 기준 약 7.8만 행)
  // 라벨에 적힌 업체 이름 → 시트(귀책 목록)에 있는 이름. 왼쪽은 (주)·㈜·주식회사·공백·점을 뺀 글자로 적기
  ASK_VENDOR: '확인요청',
  // 학습 기록: 사람이 확인한 값(발주번호·품번 → 프로젝트·귀책)을 모든 휴대폰이 같이 씀.
  // 학습기록_AppsScript.gs 를 웹 앱으로 배포한 뒤 그 주소(…/exec)를 넣기. 비워 두면 꺼짐
  LEARN_URL: '',   // 귀책을 모를 때 [확인요청] 버튼을 누르면 귀책 칸에 들어가는 글자
  VENDOR_ALIAS: {
    '브이피시스템': 'VP시스템',
    '한국메카트로닉스': '한국메카',
    '부성LTS': '부성LTS',
    '해룡엔지니어링': '해룡엔지니어링',
  },
  // 사진 인식 도구 (무료, 휴대폰 안에서 처리). 버전을 바꿀 때만 수정
  LIB: 'https://cdn.jsdelivr.net/npm/',
  ZXING: 'zxing-wasm@2.2.4',
  TESS: 'tesseract.js@5.1.1',
  TESS_CORE: 'tesseract.js-core@5.1.1',
};
// 사진 읽는 방법 (시험 결과로 정한 값: 2배 확대 + 한 덩어리 글자 모드가 가장 잘 읽힘)
const QS0 = new URLSearchParams(location.search);   // 시험용 설정 바꾸기
const PASS = {
  main:  { scale:2,   maxDim:2400, minDim:1600 },                 // 1차: 사진 전체
  check: { scale:1.5, maxDim:2000, minDim:1200, psm:'11' },      // 2차(라벨): 흩어진 글자 모드로 한 번 더 → 결과 비교
  titleBlock: { x:0.5, y:0.72, w:0.5, h:0.28 },                    // 도면 표제란 위치(오른쪽 아래)
  zoom:  { scale:2,   maxDim:2400 },
  moire: { scale:1,   maxDim:1600, blur:2, ch:'lum' },             // 모니터를 찍은 사진(물결무늬)
  qrBoxFixed: [-4.5, 8.5, -6.5, 3.5], // 라벨 종이를 못 찾았을 때 쓸 범위 (QR 한 변 = 1칸)
  qrBoxMin: [-3, 7, -4.5, 2.5],     // 라벨을 찾았어도 항상 포함할 QR 둘레 범위
  inkRatio: 0.6,                    // 흑백 기준: 종이 밝기의 60%보다 어두우면 글자
  qrSidePx: +(QS0.get('qs') || 380), // 라벨을 잘라낼 때 QR 한 변을 몇 픽셀로 맞출지 (글자 크기 결정)
  maxCrop: +(QS0.get('mc') || 2400), // 잘라낸 라벨의 긴 변 최대 픽셀 (클수록 정확하지만 느림)
  secondAlways: QS0.has('second'), invert: !QS0.has('noinv'),
  qrBox: [-9, 9, -7.5, 4.5],        // 라벨을 찾을 범위, QR 중심 기준 (QR 한 변 = 1칸): 왼쪽, 오른쪽, 위, 아래
  paperTh: [0.9, 0.94, 0.97], paperStep: 14,   // 라벨 종이 찾기: QR 둘레 밝기의 90%(번지면 94%, 97%) 이상 + 이웃 점과 밝기 차이 14 이하
  clean: !QS0.has('noclean'), massRatio: +(QS0.get('mass') || 0.02), speck: +(QS0.get('speck') || 0),   // 큰 검은 덩어리 지우기 (점 지우기는 한글 획까지 지워서 끔)
  bigPhoto: 1600,                   // 이보다 큰 사진(휴대폰 원본)은 라벨만 잘라서 읽음
  orient: { maxDim:1600, psm:'11' },// QR이 없을 때 방향 찾기용 빠른 읽기
  wordPx: 34,                       // QR 없이 글자 영역을 잘라 다시 읽을 때 글자 높이를 몇 픽셀로 맞출지
};
const QS = new URLSearchParams(location.search);
const LIB = QS.get('lib') || CONFIG.LIB;     // 시험용: ?lib=로 라이브러리 위치를 바꿀 수 있음

/* ================== 유틸 ================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clean = s => String(s ?? '').replace(/\s+/g,' ').trim();
const key = s => clean(s).toUpperCase().replace(/\s+/g,'');
const ko = (a,b) => String(a).localeCompare(String(b),'ko');
const store = { get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v);}catch(e){return d;} },
                set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} } };
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1400); }
const CHO = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
const choseong = s => [...String(s)].map(ch => { const c=ch.charCodeAt(0)-0xAC00; return (c>=0&&c<11172)? CHO[Math.floor(c/588)] : ch; }).join('');
const JAMO2 = {'ㄳ':'ㄱㅅ','ㄵ':'ㄴㅈ','ㄶ':'ㄴㅎ','ㄺ':'ㄹㄱ','ㄻ':'ㄹㅁ','ㄼ':'ㄹㅂ','ㄽ':'ㄹㅅ','ㄾ':'ㄹㅌ','ㄿ':'ㄹㅍ','ㅀ':'ㄹㅎ','ㅄ':'ㅂㅅ'};
const splitJamo = s => String(s||'').replace(/[ㄳㄵㄶㄺㄻㄼㄽㄾㄿㅀㅄ]/g, c => JAMO2[c]);
// 품명 표기: 영문은 대문자, 프레임/FRAME이 들어가면 '-'
const fmtName = n => { n = clean(n); if (!n) return ''; if (/프레임|FRAME/i.test(n)) return '-'; return n.toUpperCase(); };
// 글자 인식에서 헷갈리는 글자를 같은 값으로 맞춤 (O↔0, I↔1 등) → 품번·프로젝트 대조용
const normC = s => String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'')
  .replace(/[OQD]/g,'0').replace(/[IL]/g,'1').replace(/Z/g,'2').replace(/S/g,'5').replace(/B/g,'8').replace(/G/g,'6');
// 업체 이름 대조용: (주)·㈜·주식회사·공백·점 제거
const normV = s => String(s||'').toUpperCase().replace(/\(주\)|㈜|주식회사|\(유\)|\(株\)|\(쥐\)|\(추\)/g,'').replace(/[^0-9A-Z가-힣]/g,'');
const normP = s => normC(s).replace(/C/g, '0');   // 프로젝트 비교용: C를 0으로 읽는 경우까지 같은 값으로
const normN = s => String(s||'').toUpperCase().replace(/[^0-9A-Z가-힣]/g,'');
function lev(a, b, max){
  const m=a.length, n=b.length; if (Math.abs(m-n)>max) return max+1;
  let prev = Array.from({length:n+1},(_,j)=>j), cur = new Array(n+1);
  for (let i=1;i<=m;i++){ cur[0]=i; let lo=cur[0];
    for (let j=1;j<=n;j++){ cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(a[i-1]===b[j-1]?0:1)); if(cur[j]<lo) lo=cur[j]; }
    if (lo>max) return max+1; [prev,cur]=[cur,prev]; }
  return prev[n];
}

/* ================== 구글시트 읽기 (JSONP, 공개 링크) ================== */
let jsonpN = 0;
async function loadSheet(cfg, parse, ok){
  const Y = new Date().getFullYear(), seen = new Set(), cands = [];
  const add = c => { const k = c.sheet || 'gid:'+c.gid; if (!seen.has(k)) { seen.add(k); cands.push(c); } };
  (cfg.names ? cfg.names(Y) : []).forEach(n => add({ sheet:n, range:cfg.range }));
  if (cfg.gid) add({ gid:cfg.gid, range:cfg.range });
  (cfg.names ? cfg.names(Y-1) : []).forEach(n => add({ sheet:n, range:cfg.range }));
  const got = [], sigs = new Set();
  for (const c of cands) {
    try {
      const rows = await gviz(c);
      const sig = rows.length + '|' + JSON.stringify(rows.slice(0,8));   // 같은 시트를 이름·gid로 두 번 읽은 경우 제외
      if (sigs.has(sig)) continue;
      const x = parse(rows); if (!ok(x)) continue;   // gviz는 없는 시트 이름이면 첫 시트를 주므로 내용으로 검증
      sigs.add(sig); got.push(x);
      if (!cfg.merge) break;
    } catch(e) {}
  }
  if (!got.length) throw new Error('시트를 찾지 못함');
  return got;
}
function gviz(src){
  return new Promise((res, rej) => {
    const cb = '__gv' + (++jsonpN) + '_' + Date.now();
    const p = new URLSearchParams({ tqx:'out:json;responseHandler:'+cb, headers:'0', range: src.range });
    if (src.sheet) p.set('sheet', src.sheet); else if (src.gid) p.set('gid', src.gid);
    const s = document.createElement('script');
    const done = () => { delete window[cb]; s.remove(); clearTimeout(to); };
    const to = setTimeout(() => { done(); rej(new Error('시간 초과')); }, 20000);
    window[cb] = resp => { done();
      if (resp.status === 'error') return rej(new Error((resp.errors||[])[0]?.detailed_message || '시트 오류'));
      res((resp.table?.rows || []).map(r => (r.c || []).map(c => c ? String(c.f ?? c.v ?? '') : '')));
    };
    s.onerror = () => { done(); rej(new Error('불러오기 실패')); };
    s.src = `https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq?` + p.toString();
    document.head.appendChild(s);
  });
}

/* ================== 시트 파싱 (제목 글자로 위치 찾기) ================== */
const isTitle = s => /^\s*\d+(\.\d+)+\s/.test(s||'');
function parseVendors(rows){
  const out = []; let mode = null;
  for (const r of rows) {
    const [a='', b=''] = r.map(clean);
    if (isTitle(a)) { mode = null; continue; }
    if (a==='대분류' && b==='세부귀책') { mode = 'ven'; continue; }
    if (a==='대분류') { mode = null; continue; }
    if (mode==='ven' && a && b) out.push({ big:a, name:b });
  }
  return out;
}
function parseProj(rows){
  const out = []; let on = false;
  for (const r of rows) {
    const [a='', b=''] = r.map(clean);
    if (!on) { if (/발주명|PROJECT/i.test(a) && /^TYPE|타입/i.test(b)) on = true; continue; }
    if (a && !/발주명|PROJECT/i.test(a)) out.push({ name:a, type:b, k:key(a) });
  }
  return out;
}
function parseParts(rows){
  const isPnH = x => /^(품번|도번|part ?(no|number))/i.test(clean(x).replace(/\s/g,''));
  const isNmH = x => /^(품명|item ?name|name)/i.test(clean(x).replace(/\s/g,''));
  let pi = -1, ni = -1, start = 0;
  for (let i = 0; i < Math.min(rows.length, 20); i++) {
    const r = rows[i]; const a = r.findIndex(isPnH), b = r.findIndex(isNmH);
    if (a >= 0 && b >= 0) { pi = a; ni = b; start = i + 1; break; }
  }
  if (pi < 0) {
    const n = Math.max(...rows.slice(0,50).map(r=>r.length), 2);
    const score = j => rows.slice(0,300).filter(r => /\d/.test(r[j]||'') && /-/.test(r[j]||'')).length;
    pi = [...Array(n).keys()].sort((a,b)=>score(b)-score(a))[0]; ni = pi + 1 < n ? pi + 1 : pi - 1;
  }
  const map = new Map();
  for (const r of rows.slice(start)) {
    const pn = clean(r[pi]), nm = clean(r[ni]);
    if (!pn || isPnH(pn)) continue;
    for (const one of pn.split(/\s*[\/,\n]\s*/)) {
      const k = key(one); if (k.length < 3) continue;
      if (!map.has(k)) map.set(k, { pn: one, name: nm });
    }
  }
  return map;
}

// 요청자 명단: 품명/품번 시트의 '발견자' 제목 열 (제목을 못 찾으면 F열)
function parseFinders(rows){
  let ci = -1, start = 0;
  for (let i = 0; i < Math.min(rows.length, 30) && ci < 0; i++) {
    const j = rows[i].findIndex(x => /^(발견자|요청자)$/.test(clean(x).replace(/\s/g,'')));
    if (j >= 0) { ci = j; start = i + 1; }
  }
  if (ci < 0) { ci = 5; start = 1; }
  const seen = new Set(), out = [];
  for (const r of rows.slice(start)) { const n = clean(r[ci]); if (n && !/^(발견자|요청자)$/.test(n) && !seen.has(n)) { seen.add(n); out.push(n); } }
  return out.sort(ko);
}

/* ================== 상태 / 데이터 불러오기 ================== */
const S = { parts:new Map(), proj:[], vendors:[], finders:[], ld:{} };
const IX = { pn:new Map(), tri:new Map(), list:[], proj:[], ven:[], projBase:new Map() };
function buildIndex(){
  IX.list = [...S.parts.values()].map(p => ({ p, n:normC(p.pn), nm:normN(p.name) }));
  IX.pn = new Map(); IX.tri = new Map();
  IX.list.forEach((e,i) => {
    if (!IX.pn.has(e.n)) IX.pn.set(e.n, []); IX.pn.get(e.n).push(i);
    const seen = new Set();
    for (let j=0;j+3<=e.n.length;j++){ const t=e.n.substr(j,3); if (seen.has(t)) continue; seen.add(t); if(!IX.tri.has(t)) IX.tri.set(t,[]); IX.tri.get(t).push(i); }
  });
  const pm = new Map(); S.proj.forEach(p => { if (!pm.has(p.k)) pm.set(p.k, p); });
  IX.proj = [...pm.values()].map(p => ({ name:p.name, n:normC(p.name) })).filter(p => p.n.length >= 4);
  // 'TF01-033 EFEM' / 'TF01-033 PROCESS'처럼 끝말만 다른 이름 → 기본 이름 'TF01-033'으로 묶음
  IX.projBase = new Map(); IX.projByN = null; IX.projP = null;
  for (const p of IX.proj) { const base = p.name.replace(/\s+(EFEM|PROCESS)\s*$/i, ''); const n = normC(base); if (n.length < 5) continue;
    if (!IX.projBase.has(n)) IX.projBase.set(n, { base, list:[] }); IX.projBase.get(n).list.push(p); }
  const vm = new Map();
  S.vendors.forEach(v => { const n = normV(v.name); if (n && !vm.has(n)) vm.set(n, v.name); });
  for (const [a, b] of Object.entries(CONFIG.VENDOR_ALIAS)) { const n = normV(a); if (n) vm.set(n, b); }
  IX.ven = [...vm].map(([n, name]) => ({ n, name })).filter(v => v.n.length >= 2);
}
function setStatus(){
  const p = (ok, label) => `<span class="pill ${ok===true?'ok':ok===false?'err':''}">${label}</span>`;
  $('#status').innerHTML = [
    p(S.ld.parts, '품번 ' + (S.parts.size||'')),
    p(S.ld.proj, '프로젝트 ' + (S.proj.length||'')),
    p(S.ld.ven, '귀책 ' + (S.vendors.length||'')),
    p(S.ld.parts, '요청자 ' + (S.finders.length||'')),
    learnOn() ? p(LEARN.ok, '기록 ' + (Object.keys(LEARN.pur).length + Object.keys(LEARN.pn).length || '')) : '',
  ].join('');
}
async function loadAll(){
  const cache = store.get('dl_cache', null);
  if (cache) { S.proj = cache.proj || []; S.vendors = cache.vendors || []; S.finders = cache.finders || []; buildIndex(); }
  setStatus();
  const jobs = [
    loadSheet(CONFIG.PARTS, r=>({ parts:parseParts(r), finders:parseFinders(r) }), x=>x.parts.size>0).then(([x])=>{ S.parts=x.parts; S.finders=x.finders; S.ld.parts=true; }).catch(()=>S.ld.parts=false),
    loadSheet(CONFIG.PROJ, parseProj, x=>x.length>0).then(list=>{ const m=new Map(); list.flat().forEach(p=>{ if(!m.has(p.k)) m.set(p.k,p); }); S.proj=[...m.values()]; S.ld.proj=true; }).catch(()=>S.ld.proj=false),
    loadSheet(CONFIG.REF, parseVendors, x=>x.length>0).then(([x])=>{ S.vendors=x; S.ld.ven=true; }).catch(()=>S.ld.ven=false),
  ];
  for (const j of jobs) j.then(setStatus);
  await Promise.all(jobs);
  buildIndex(); setStatus();
  if (S.ld.parts || S.ld.proj || S.ld.ven) store.set('dl_cache', { proj:S.proj, vendors:S.vendors, finders:S.finders });   // 품번은 너무 많아서 저장하지 않음
}

/* ================== 학습 기록 (사람이 확인한 값을 모든 휴대폰이 같이 씀) ================== */
// 열쇠: 발주번호(PUR 뒤 숫자 10자리) → 프로젝트·귀책 (같은 발주는 같은 값이라 믿을 만함)
//       품번 → 프로젝트·귀책 (참고용: 빈 칸이나 '확인 필요' 칸만 채움)
// 값 모양: { p:[프로젝트, 확인 횟수], v:[귀책, 확인 횟수] }
const LEARN = { pur:{}, pn:{}, ok:null };
const learnOn = () => !!CONFIG.LEARN_URL;
async function loadLearn(){
  if (!learnOn()) return;
  const c = store.get('dl_learn', null); if (c) { LEARN.pur = c.pur || {}; LEARN.pn = c.pn || {}; }
  setStatus();
  try {
    const j = await (await fetch(CONFIG.LEARN_URL, { cache:'no-store' })).json();
    if (j.ok) { LEARN.pur = j.pur || {}; LEARN.pn = j.pn || {}; LEARN.ok = true;
      for (const r of store.get('dl_learnq', [])) learnLocal(r);   // 아직 못 보낸 기록도 반영
      store.set('dl_learn', { pur:LEARN.pur, pn:LEARN.pn }); }
  } catch(e) { LEARN.ok = false; }
  setStatus(); flushLearn();
}
function learnLocal(r){   // 이 휴대폰에서 바로 반영 (서버 요약은 다음에 열 때 받음)
  const put = (m, k, f, val) => { if (!k || !val || val === CONFIG.ASK_VENDOR) return; const o = m[k] ||= {};
    o[f] = o[f] && o[f][0] === val ? [val, o[f][1] + 1] : [val, 1]; };
  put(LEARN.pur, r.pur, 'p', r.proj); put(LEARN.pur, r.pur, 'v', r.ven);
  put(LEARN.pn, key(r.pn), 'p', r.proj); put(LEARN.pn, key(r.pn), 'v', r.ven);
}
async function flushLearn(){   // 못 보낸 기록을 보냄 (인터넷이 끊겼으면 다음에 다시)
  if (!learnOn() || flushLearn.busy) return;
  const q = store.get('dl_learnq', []); if (!q.length) return;
  flushLearn.busy = true;
  try {
    const j = await (await fetch(CONFIG.LEARN_URL, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify({ recs:q }) })).json();
    if (j.ok) store.set('dl_learnq', store.get('dl_learnq', []).slice(q.length));
  } catch(e) {} finally { flushLearn.busy = false; }
}
// 사진에서 읽은 발주번호: 'PUR' 뒤 숫자 10자리 (20으로 시작). 여러 번 읽은 것 중 가장 많이 나온 값
function findPur(texts){
  const cnt = new Map();
  for (const t of texts) { const s = String(t || '').replace(/[ \t]/g, '');
    for (const m of s.matchAll(/(?:PUR|[PJ]?UR|JR|PJR)[:.]?(20\d{8})(?!\d)/gi)) cnt.set(m[1], (cnt.get(m[1]) || 0) + 2);
    for (const m of s.matchAll(/(?<!\d)(20[2-3]\d{7})(?!\d)/g)) cnt.set(m[1], (cnt.get(m[1]) || 0) + 1); }
  return [...cnt].sort((a,b) => b[1] - a[1])[0]?.[0] || '';
}

function loadImg(file){
  return new Promise((res, rej) => { const u = URL.createObjectURL(file); const im = new Image();
    im.onload = () => res(im); im.onerror = () => rej(new Error('사진을 열 수 없음')); im.src = u; });
}
// rot: 시계방향 회전(0/90/180/270), crop: 비율 {x,y,w,h}, maxDim/minDim: 긴 변 크기 범위, gray: 흑백+대비, blur: 흐림(물결무늬 줄이기)
function prep(img, { rot=0, crop=null, maxDim=2000, minDim=0, scale=0, gray=true, blur=0, ch='min' } = {}){
  const W = img.naturalWidth || img.width, H = img.naturalHeight || img.height;
  const c = crop || { x:0, y:0, w:1, h:1 };
  const sx = Math.round(W*c.x), sy = Math.round(H*c.y), sw = Math.round(W*c.w), sh = Math.round(H*c.h);
  let s = Math.min(1, maxDim / Math.max(sw, sh));
  if (minDim && Math.max(sw, sh) * s < minDim) s = Math.min(3, minDim / Math.max(sw, sh));
  if (scale) s = Math.min(scale, maxDim / Math.max(sw, sh));
  const w = Math.max(1, Math.round(sw*s)), h = Math.max(1, Math.round(sh*s));
  const cv = document.createElement('canvas');
  const sw90 = rot===90 || rot===270;
  cv.width = sw90 ? h : w; cv.height = sw90 ? w : h;
  const x = cv.getContext('2d', { willReadFrequently:true });
  x.fillStyle = '#fff'; x.fillRect(0,0,cv.width,cv.height);
  x.imageSmoothingEnabled = true; x.imageSmoothingQuality = 'high';
  x.translate(cv.width/2, cv.height/2); x.rotate(rot*Math.PI/180);
  x.drawImage(img, sx, sy, sw, sh, -w/2, -h/2, w, h);
  x.setTransform(1,0,0,1,0,0);
  // 이 캔버스 좌표 → 원본 사진 좌표로 되돌리는 데 필요한 값
  cv._map = (u, v) => { const a = -rot*Math.PI/180, du = u - cv.width/2, dv = v - cv.height/2;
    return [ (du*Math.cos(a) - dv*Math.sin(a) + w/2) / s + sx, (du*Math.sin(a) + dv*Math.cos(a) + h/2) / s + sy ]; };
  cv._s = s;
  return enhance(cv, { gray, blur, ch });
}
// 원본 사진에서 임의 각도로 기울어진 사각형을 잘라 똑바로 펴기
//   (cx,cy): 기준점(원본 좌표), ang: 라벨 가로 방향의 각도(라디안), x0~x1 / y0~y1: 기준점에서의 범위(원본 픽셀), k: 확대 배율
function cropRot(img, { cx, cy, ang, x0, x1, y0, y1, k, gray=true, ch='min', blur=0, bin=false, clean=false }){
  const cv = document.createElement('canvas');
  cv.width = Math.max(1, Math.round((x1-x0)*k)); cv.height = Math.max(1, Math.round((y1-y0)*k));
  const x = cv.getContext('2d', { willReadFrequently:true });
  x.fillStyle = '#fff'; x.fillRect(0,0,cv.width,cv.height);
  x.imageSmoothingEnabled = true; x.imageSmoothingQuality = 'high';
  const co = Math.cos(ang)*k, si = Math.sin(ang)*k;
  x.setTransform(co, -si, si, co, -co*cx - si*cy - k*x0, si*cx - co*cy - k*y0);
  x.drawImage(img, 0, 0);
  x.setTransform(1,0,0,1,0,0);
  return enhance(cv, { gray, blur, ch, bin, clean });
}
function enhance(cv, { gray=true, blur=0, ch='min', bin=false, clean=false } = {}){
  if (!gray && !blur && !bin) return cv;
  const x = cv.getContext('2d', { willReadFrequently:true });
  const d = x.getImageData(0,0,cv.width,cv.height), a = d.data, n = cv.width*cv.height;
  let g = new Float32Array(n);
  for (let i=0;i<n;i++) g[i] = ch === 'lum' ? 0.299*a[i*4] + 0.587*a[i*4+1] + 0.114*a[i*4+2]
    : Math.min(a[i*4], a[i*4+1], a[i*4+2]);   // 가장 어두운 색 채널 → 도면의 하늘색 글자도 진하게
  for (let k=0;k<blur;k++) g = boxBlur(g, cv.width, cv.height);
  if (bin) {   // 흑백 두 색으로. 숫자면 '종이 밝기 × 그 비율'을 기준으로 (스티로폼·비닐처럼 밝은 회색 무늬는 흰색으로 사라짐)
    let th;
    if (typeof bin === 'number') { const h = new Uint32Array(256); for (let i=0;i<n;i++) h[Math.max(0, Math.min(255, g[i]|0))]++;
      let acc = 0, p95 = 255; for (let v=0; v<256; v++) { acc += h[v]; if (acc >= n*0.95) { p95 = v; break; } }
      th = p95 * bin; }
    else th = otsu(g);
    const ink = new Uint8Array(n); for (let i=0;i<n;i++) ink[i] = g[i] > th ? 0 : 1;
    if (clean) cleanInk(ink, cv.width, cv.height);
    for (let i=0;i<n;i++){ const v = ink[i] ? 0 : 255; a[i*4]=a[i*4+1]=a[i*4+2]=v; }
    x.putImageData(d,0,0); return cv;
  }
  // 대비 늘리기: 하위 2% → 검정, 상위 2% → 흰색
  const hist = new Uint32Array(256); for (let i=0;i<n;i++) hist[g[i]|0]++;
  let lo=0, hi=255, acc=0; for (; lo<255; lo++){ acc+=hist[lo]; if (acc>n*0.02) break; }
  acc=0; for (; hi>0; hi--){ acc+=hist[hi]; if (acc>n*0.02) break; }
  const r = Math.max(1, hi-lo);
  for (let i=0;i<n;i++){ const v = Math.max(0, Math.min(255, (g[i]-lo)*255/r)); a[i*4]=a[i*4+1]=a[i*4+2]=v; }
  x.putImageData(d,0,0);
  return cv;
}
// 검은 덩어리 지우기: 이미지의 2% 넘는 큰 덩어리(검은 상자 면·그림자)와 몇 px짜리 점(스티로폼 무늬)
// → 글자 인식이 이런 곳에서 오래 헤매지 않음. 글자·표 선은 그대로
function cleanInk(ink, W, H){
  const n = W*H, big = n * PASS.massRatio, small = PASS.speck, lab = new Int32Array(n), st = new Int32Array(n);
  let id = 0;

    id++; let sp = 0, cnt = 0; st[sp++] = s0; lab[s0] = id;

    const p = IX.proj.find(p => p.n.length === n.length + 1 && p.n.endsWith(n) && /[A-Z]/.test(p.name[0]));
    if (p) return { name: p.name, known: true, weak: true };

  return m ? { name: m[1].replace(/\s/g,''), known: false } : null;
}
function findQty(text){
  const t = String(text);
  // ① '수량 : 2' / '수 량 | 2' / '발주수량 4ea'
  let m = t.match(/수\s*량\s*[:：;.|\]]*\s*([0-9]{1,4})\s*(?:EA|ea|개)?\b/);
  if (m && +m[1] < 1000) return String(+m[1]);   // 부적합 수량은 거의 1000 미만 (넘으면 잘못 읽은 것으로 봄)
  // ② 숫자 바로 뒤 EA (OCR이 잘못 읽는 글자 보정: z→2, ㅣ·|·l·I·[→1, O→0, S→5)
  const fix = d => d.replace(/[zZ]/g,'2').replace(/[ㅣ|lI\[\]!]/g,'1').replace(/[oO]/g,'0').replace(/[sS]/g,'5');
  const ms = [...t.matchAll(/(?:^|[\s:|(\[])([0-9zZㅣ|lI!oO]{1,4})[ \t]{0,40}(?:EA|Ea|ea|eA|개|PCS|pcs|SET|set)\b/g)];   // 같은 줄에서 멀리 떨어져 있어도
  for (const x of ms) { const v = fix(x[1]); if (/^\d+$/.test(v) && +v > 0 && +v < 1000) return String(+v); }
  return '';
}
function findVendor(text){
  const T = normV(text); if (!T) return null;
  let best = null;
  const take = (v, s) => { if (!best || s > best.s || (s === best.s && v.n.length > best.n.length)) best = { ...v, s }; };
  for (const v of IX.ven) {
    if (v.n.length >= 3 && T.includes(v.n)) { take(v, 1); continue; }
    if (v.n.length >= 4 && /[가-힣]/.test(v.n)) {   // 한두 글자 잘못 읽힌 경우 (한글 이름만. 영문 이름은 우연히 비슷한 글자가 많아 정확히 같을 때만)
      const md = v.n.length >= 6 ? 2 : 1;
      for (let i=0;i+v.n.length-1<=T.length;i++) {
        const d = lev(v.n, T.substr(i, v.n.length), md);
        if (d <= md) { take(v, 0.9 - d*0.1); break; }
      }
    }
  }
  return best;
}
// 품번 목록에 없는 부품용: 품번처럼 생긴 글자를 그대로 가져옴 (숫자가 섞인 칸의 O는 0으로)
function rawPart(text){
  const fix = t => t.toUpperCase().split('-').map(g => /\d/.test(g) ? g[0] + g.slice(1).replace(/O/g,'0') : g.replace(/OO+/g, m => '0'.repeat(m.length))).join('-');
  const projs = new Set(IX.proj.map(p => p.n));
  const anc = (String(text).match(/(?:품번|DWG\s*No\.?|Part\s*No\.?)[\s:：|.]*([A-Za-z0-9-]+)/i) || [])[1];
  const ok = t => /^[A-Z0-9]{2,6}(-[A-Z0-9]{1,6}){1,3}$/.test(t) && /\d/.test(t) && /[A-Z]/.test(t) && t.length >= 8 && !/^PUR/.test(t) && !projs.has(normC(t));
  if (anc && ok(fix(anc))) return fix(anc);
  const toks = String(text).split(/[\s,;|()]+/).map(t => fix(t.replace(/^[^A-Za-z0-9]+|[^A-Za-z0-9]+$/g,''))).filter(ok);
  return toks.sort((a,b) => (b.split('-').length - a.split('-').length) || b.length - a.length)[0] || '';
}
const isDrawing = t => [/DWG/i, /Surface\s*Rough/i, /\bScale\b/i, /Toleran/i, /Drawn\s*by/i, /Descrip/i, /Material/i].filter(r => r.test(t)).length >= 2;
function analyze(text, conf){
  const drawing = isDrawing(text);
  const parts = partCands(text);
  const r = { text, conf, drawing, parts, raw: rawPart(text),
    proj: drawing ? null : findProj(text),
    qty: drawing ? '' : findQty(text),
    ven: drawing ? null : findVendor(text) };
  r.score = (parts[0]?.exact ? 3 : parts[0] ? parts[0].s : 0) + (r.proj?.known ? 1 : 0) + (r.ven ? 0.5 : 0) + (r.qty ? 0.3 : 0) + (conf||0)/200;
  return r;
}

/* ================== 사진 인식 순서 ==================
   1) QR/바코드 → 품번, 그리고 QR 위치·기울기로 라벨만 잘라 똑바로 편 뒤 글자 읽기
   2) QR이 없으면 → 네 방향으로 빠르게 읽어 방향을 찾고, 글자가 모인 곳만 잘라 크게 다시 읽기
   3) 그래도 품번이 없으면(도면 등) → 오른쪽 아래 표제란 확대, 흐림 보정 */
async function recognize(file){
  const img = await loadImg(file);
  $('#thumb').src = img.src;
  const out = { pn:null, cands:[], proj:null, qty:'', ven:null, drawing:false, via:'', ms:{} };
  const T0 = performance.now(), lap = k => out.ms[k] = Math.round(performance.now() - T0);
  lap('load');
  const wP = Promise.all(Array.from({ length:PAR }, (_, i) => ocrWorker(i))); wP.catch(() => {});   // 글자 인식 준비를 QR 읽는 동안 같이
  // 1) QR/바코드
  step('QR 읽는 중…', 5);
  let rot = null, anchor = null;
  try {
    const codes = await readCodes(img);
    for (const c of codes) {
      const hit = codePart(c.text);
      if (hit) { out.pn = { pn:hit.pn, name:hit.name, known:true }; anchor = c; break; }
    }
    if (!out.pn) { const c = codes.find(c => /^[A-Z0-9]{2,}(-[A-Z0-9_]+){1,4}$/i.test(clean(c.text)) && /\d/.test(c.text) && !/^PUR|^PDI/i.test(c.text));
      if (c) { out.pn = { pn:clean(c.text).toUpperCase(), name:'', known:false }; anchor = c; } }
    anchor ||= codes.filter(c => c.geo).sort((a,b) => b.geo.side - a.geo.side)[0] || null;
    if (anchor && !anchor.geo) anchor = null;
    if (anchor) rot = rotFromCode(anchor);
    if (out.pn) out.via = 'QR';
    out.codes = codes.map(c => c.text);
  } catch(e) { console.warn('QR', e); }
  lap('qr');
  // 2) 글자 인식
  step('글자 인식 준비 중… (처음 한 번만 오래 걸려요)', 15);
  const OW = await wP;
  lap('worker');
  const passes = [];
  const read = async (cv, psm, blocks, wi = 0) => {
    const w = OW[wi % OW.length];
    if (w._psm !== psm) { await w.setParameters({ tessedit_pageseg_mode: psm }); w._psm = psm; }
    const t0 = performance.now(), d = (await w.recognize(cv, {}, blocks ? { blocks:true } : {})).data;
    d._ms = Math.round(performance.now() - t0); d._wh = cv.width + 'x' + cv.height; return d;
  };
  const keep = (data, opt) => { const r = analyze(data.text, data.confidence); r.opt = { ...opt, ms:data._ms, wh:data._wh }; passes.push(r); return r; };
  const run = async (label, opt, pct) => { step(label, pct); return keep(await read(prep(img, opt), opt.psm || '6'), opt); };
  const gotPart = () => out.pn || passes.some(p => p.parts[0]?.exact);
  const any = () => gotPart() || passes.some(p => p.parts.length || p.proj || p.ven || p.raw);
  let r0 = rot ?? 0;
  const big = Math.max(img.naturalWidth || img.width, img.naturalHeight || img.height) > PASS.bigPhoto;
  if (!big) {
    // 작은 사진(화면 캡처 등): 사진 전체를 2배로 키워 두 가지 방식으로 읽기, 아무것도 없으면 다른 방향
    await run('글자 읽는 중…', { rot:r0, ...PASS.main }, 30);
    if (!passes.at(-1).drawing) await run('한 번 더 확인 중…', { rot:r0, ...PASS.check }, 50);
    if (rot == null && !any()) for (const [i, rr] of [90, 270, 180].entries()) {
      await run(`다른 방향으로 읽는 중… (${i+1}/3)`, { rot:rr, ...PASS.main }, 55 + i*5);
      if (any()) { r0 = rr; break; }
    }
  } else if (anchor) {
    // QR 둘레 라벨만 잘라 읽기 (두 가지 방식으로 읽어 서로 비교)
    step('라벨 읽는 중…', 30);
    const cv = labelFromCode(img, anchor.geo);
    // 두 번째는 덩어리를 지우지 않은 그림으로 (흰 글씨 검은 바탕 수량표 등을 놓치지 않게)
    const cv2 = () => PASS.clean ? labelFromCode(img, anchor.geo, { clean:false }) : cv;

      const [a, b] = await Promise.all([read(cv, '6', false, 0), read(cv2(), '11', false, 1)]);
      keep(a, { label:'qr', psm:'6' }); keep(b, { label:'qr', psm:'11' });
    } else {
      keep(await read(cv, '6'), { label:'qr', psm:'6' });
      const p1 = passes.at(-1);
      if (PASS.secondAlways || !(p1.proj && p1.ven && p1.qty)) {   // 다 읽었으면 두 번째 읽기는 건너뜀
        step('한 번 더 확인 중…', 50);
        keep(await read(cv2(), '11'), { label:'qr', psm:'11' });
      }
    }

    const orRead = (rr, wi) => { const cv = prep(img, { rot:rr, ...PASS.orient }); return read(cv, PASS.orient.psm, true, wi).then(data => ({ rr, cv, data })); };
    const judge = ({ rr, cv, data }) => {   // 점수를 매기고, 이 방향이 확실하면 true
      const words = (data.blocks||[]).flatMap(b => b.paragraphs).flatMap(p => p.lines).flatMap(l => l.words);
      const good = words.filter(x => x.confidence > 70 && /^([A-Za-z]{3,}|[가-힣]{2,}|[A-Z0-9]+-[A-Z0-9-]+|\d{3,})$/.test(x.text));
      const a = analyze(data.text, data.confidence);
      const sc = good.length*3 + data.confidence/10 + (/(PUR|20[0-9]{2})[0-9]{4,}/.test(data.text.replace(/\s/g,'')) ? 6 : 0) + (a.parts[0]?.exact ? 6 : 0) + (a.proj?.known ? 3 : 0) + (a.drawing ? 6 : 0);
      if (!best || sc > best.sc) best = { sc, rr, cv, words: good.length >= 3 ? good : words.filter(x => x.confidence > 50 && x.text.length >= 2), a, data };
      return good.length >= 8 && data.confidence >= 65;
    };
    // 0°, 270°, 90°, 180° 순서. 인식기가 2개면 두 방향씩 동시에. 확실한 방향이 나오면 나머지는 건너뜀
    const ORS = [0, 270, 90, 180], n = OW.length > 1 ? 2 : 1;
    for (let i = 0; i < ORS.length; i += n) {
      step(`방향 확인 중… (${Math.min(i+n, 4)}/4)`, 20 + i*6);
      const got = await Promise.all(ORS.slice(i, i+n).map((rr, j) => orRead(rr, j)));
      if (got.map(judge).some(Boolean)) break;
    }
    r0 = best.rr; best.a.opt = { label:'orient', rot:r0 }; passes.push(best.a);
    // 글자가 모인 곳만 원본 해상도로 잘라 크게 다시 읽기
    const ws = best.words;
    if (ws.length >= 2) {
      const ang = -r0 * Math.PI / 180, co = Math.cos(ang), si = Math.sin(ang);
      const W = img.naturalWidth || img.width, H = img.naturalHeight || img.height, cx = W/2, cy = H/2;
      const pts = ws.flatMap(x => [[x.bbox.x0, x.bbox.y0], [x.bbox.x1, x.bbox.y1]]).map(([u,v]) => best.cv._map(u, v))
        .map(([X,Y]) => [(X-cx)*co + (Y-cy)*si, -(X-cx)*si + (Y-cy)*co]);
      const xs = pts.map(p => p[0]).sort((a,b) => a-b), ys = pts.map(p => p[1]).sort((a,b) => a-b);
      const q = (arr, f) => arr[Math.min(arr.length-1, Math.max(0, Math.round(f*(arr.length-1))))];
      let x0 = q(xs,0.02), x1 = q(xs,0.98), y0 = q(ys,0.02), y1 = q(ys,0.98);
      const mx = (x1-x0)*0.12 + 20, my = (y1-y0)*0.12 + 20; x0 -= mx; x1 += mx; y0 -= my; y1 += my;
      const hs = ws.map(x => x.bbox.y1 - x.bbox.y0).sort((a,b) => a-b), hmed = hs[hs.length >> 1] / best.cv._s;
      let k = Math.min(2.5, PASS.wordPx / Math.max(4, hmed));
      k = Math.min(k, 2600 / Math.max(x1-x0, y1-y0));
      const wide = (x1-x0) * (y1-y0) > 0.6 * W * H;   // 글자가 사진 전체에 퍼져 있으면(도면 등) 자르지 않음
      if (!wide) {
        const cv = cropRot(img, { cx, cy, ang, x0, x1, y0, y1, k, bin:PASS.inkRatio });
        step('글자 부분 확대해서 읽는 중…', 50);
        if (OW.length > 1) { const [a, b] = await Promise.all([read(cv, '6', false, 0), read(cv, '11', false, 1)]);
          keep(a, { label:'words', psm:'6' }); keep(b, { label:'words', psm:'11' }); }
        else {
          keep(await read(cv, '6'), { label:'words', psm:'6' });
          step('한 번 더 확인 중…', 60);
          keep(await read(cv, '11'), { label:'words', psm:'11' });
        }
      } else {
        await run('글자 읽는 중…', { rot:r0, ...PASS.main }, 50);
        if (!passes.at(-1).drawing) await run('한 번 더 확인 중…', { rot:r0, ...PASS.check }, 60);
      }
    }
  }
  // 표제란 확대: 작은 사진(화면 캡처)이거나 도면으로 보일 때만 (라벨 사진에서는 시간만 듦)
  if (!gotPart() && (!big || passes.some(p => p.drawing))) await run('표제란 확대해서 읽는 중…', { rot:r0, crop: cropFor(r0, PASS.titleBlock), ...PASS.zoom }, 70);
  if (!gotPart()) await run('흐림 보정해서 다시 읽는 중…', { rot:r0, ...PASS.moire }, 82);
  lap('ocr');

  const vote = (vals, keyf = x => x) => { const m = new Map();
    vals.filter(Boolean).forEach((v, i) => { const k = keyf(v); const o = m.get(k) || { v, n:0, i }; o.n++; m.set(k, o); });
    return [...m.values()].sort((a,b) => b.n - a.n || a.i - b.i); };

    for (const p of passes) for (const c of p.parts) { const o = all.get(c.pn); if (!o) all.set(c.pn, { ...c, n:1 }); else { o.n++; o.s = Math.max(o.s, c.s); o.exact = o.exact || c.exact; } }
    // 여러 번 같은 품번이 나오면 가산점
    const list = [...all.values()].map(c => ({ ...c, t: c.s + (c.n - 1) * 0.04 })).sort((a,b) => b.t - a.t);
    const top = list[0], second = list[1];
    if (top && (top.exact || (top.t >= 0.86 && (!second || top.t - second.t >= 0.08)))) { out.pn = { pn:top.pn, name:top.name, known:true, check:!top.exact }; out.via = '글자'; }
    else {
      out.cands = list.slice(0, 3);
      // 목록에서 확실한 걸 못 찾았으면 읽은 글자를 그대로 넣고 '확인 필요' 표시 (목록에 없는 외주 부품 등)
      const raw = vote(passes.filter(p => p.opt.label !== 'orient').map(p => p.raw))[0]?.v;
      if (raw) { out.pn = { pn:raw, name:'', known:false, check:true }; out.via = '글자'; out.cands = list.filter(c => c.pn !== raw).slice(0, 3); }
    }
  }
  // 프로젝트·수량·귀책: 여러 번 읽은 결과 중 가장 많이 나온 값
  const pj = vote(passes.map(p => p.proj), x => x.name).sort((a,b) => (b.v.known - a.v.known) || b.n - a.n || a.i - b.i);
  if (pj[0]) { out.proj = { ...pj[0].v, check: !pj[0].v.known || pj[0].v.weak || pj.length > 1 }; out.projAlt = pj.slice(1, 3).map(x => x.v.name); }
  out.qty = vote(passes.map(p => p.qty))[0]?.v || '';
  out.ven = passes.map(p => p.ven).filter(Boolean).sort((a,b) => b.s - a.s)[0] || null;
  out.pur = findPur([...passes.map(p => p.text), ...(out.codes || [])]);
  out.passes = passes.map(p => ({ opt:p.opt, score:+p.score.toFixed(2), text:p.text }));
  return out;
}
// 회전된 사진에서 "회전 후 오른쪽 아래"에 해당하는 원본 영역
function cropFor(rot, c){
  if (rot === 90)  return { x:c.y, y:1-c.x-c.w, w:c.h, h:c.w };
  if (rot === 180) return { x:1-c.x-c.w, y:1-c.y-c.h, w:c.w, h:c.h };
  if (rot === 270) return { x:1-c.y-c.h, y:c.x, w:c.h, h:c.w };
  return c;
}

/* ================== 화면 ================== */
const F = { proj:$('#iProj'), pn:$('#iPn'), qty:$('#iQty'), txt:$('#iTxt'), ven:$('#iVen'), req:$('#iReq') };
const auto = { proj:'', pn:'', qty:'', ven:'' };   // 자동으로 채운 값(사용자가 고치면 표시 사라짐)
const ctx = { pur:'', a:{}, sent:'' };              // 이번 사진: 발주번호, 사진에서 읽은 값(학습 기록용), 마지막으로 보낸 기록
function step(t, pct){ $('#pT').textContent = t; if (pct != null) $('#pB').style.width = pct + '%'; }
function tag(id, kind, text){ const e = $(id); if (!e) return; e.className = 'tag' + (kind ? ' ' + kind : ''); e.textContent = text || ''; }

    `2. 품번 : ${clean(F.pn.value).toUpperCase()}`,
    `3. 수량 : ${q ? q + ' EA' : ''}`,
    `4. 불량내용 : ${clean(F.txt.value)}`,
    `5. 귀책 : ${vn}`,
    `6. 요청자 : ${clean(F.req.value)}`,
  ].join('\n');
  const miss = [['프로젝트명',F.proj],['품번',F.pn],['수량',F.qty],['불량내용',F.txt],['귀책',F.ven],['요청자',F.req]].filter(([,e]) => !clean(e.value)).map(([n]) => n);
  const wo = $('#wOut'); wo.style.display = miss.length ? '' : 'none'; wo.textContent = miss.length ? '비어 있는 칸: ' + miss.join(', ') : '';
}
function setField(k, v, kind, label){
  F[k].value = v || ''; auto[k] = v ? clean(v) : '';
  tag('#t'+k[0].toUpperCase()+k.slice(1), v ? kind : '', v ? label : '');
}
// 학습 기록 적용. 발주번호 기록은 사진에서 읽은 값보다 우선, 품번 기록은 비었거나 불확실한 칸(weak)만
function applyLearn(weak = { proj:true, ven:true }){
  if (!learnOn()) return [];
  const a = ctx.pur && LEARN.pur[ctx.pur], b = LEARN.pn[key(F.pn.value)], used = [];
  for (const [k, f] of [['proj','p'], ['ven','v']]) {
    const cur = clean(F[k].value);
    if (a && a[f] && (!cur || a[f][0] !== cur)) { setField(k, a[f][0], 'learn', `이전 기록 · 발주번호 ${a[f][1]}회`); used.push(k); continue; }
    if (b && b[f] && (!cur || (weak[k] && b[f][0] !== cur))) { setField(k, b[f][0], 'chk', `이전 기록 · 품번 ${b[f][1]}회`); used.push(k); }
  }
  if (used.includes('proj')) showProjAlt([]);
  return used;
}
// 복사할 때 최종 값을 기록 (사람이 확인한 값). 같은 내용은 한 번만
function recordCopy(){
  if (!learnOn()) return;
  const v = { pur:ctx.pur, pn:clean(F.pn.value).toUpperCase(), proj:clean(F.proj.value), ven:clean(F.ven.value), qty:clean(F.qty.value), req:clean(F.req.value) };
  if (!(v.pn || v.pur) || !(v.proj || v.ven)) return;
  const sig = JSON.stringify(v); if (sig === ctx.sent) return; ctx.sent = sig;
  const A = ctx.a || {}, fixed = ['proj','pn','ven','qty'].filter(k => A[k] && clean(A[k]).toUpperCase() !== v[k].toUpperCase()).join(',');
  const ua = navigator.userAgent, dev = /iPhone|iPad/.test(ua) ? 'iOS' : /Android/.test(ua) ? 'Android' : 'PC';
  const rec = { t:Date.now(), ...v, a_proj:A.proj||'', a_pn:A.pn||'', a_ven:A.ven||'', a_qty:A.qty||'', fixed, dev };
  learnLocal(rec);
  store.set('dl_learnq', [...store.get('dl_learnq', []), rec].slice(-200));
  flushLearn();
}
function showCands(list){
  const box = $('#cPn');
  box.innerHTML = list.length ? '<span class="mut" style="width:100%">정확히 못 읽었어요. 맞는 품번을 눌러 주세요.</span>' + list.map(c =>
    `<button class="chip" type="button" data-pn="${esc(c.pn)}">${esc(c.pn)}<small>${esc(fmtName(c.name))}</small></button>`).join('') : '';
}
function showProjAlt(list){
  $('#cProj').innerHTML = list.length ? '<span class="mut" style="width:100%">다르게 읽힌 값도 있어요. 맞는 걸 눌러 주세요.</span>'
    + [clean(F.proj.value), ...list].filter(Boolean).map(v => `<button class="chip" type="button" data-v="${esc(v)}">${esc(v)}</button>`).join('') : '';
}
// 귀책 확인요청: 누르면 귀책 칸에 '확인요청', 다시 누르면 지움
$('#bAsk').addEventListener('click', () => {
  const on = clean(F.ven.value) === CONFIG.ASK_VENDOR;
  setField('ven', on ? '' : CONFIG.ASK_VENDOR); refresh();
  toast(on ? '확인요청을 취소했어요' : '귀책을 확인요청으로 넣었어요');
});
$('#cProj').addEventListener('click', e => { const b = e.target.closest('.chip'); if (!b) return; F.proj.value = b.dataset.v; auto.proj=''; tag('#tProj','',''); showProjAlt([]); refresh(); });
$('#cPn').addEventListener('click', e => { const b = e.target.closest('.chip'); if (!b) return; F.pn.value = b.dataset.pn; auto.pn=''; tag('#tPn','',''); showCands([]); applyLearn({ proj:false, ven:false }); refresh(); });

async function onFile(file){
  if (!file) return;
  $('#shot').style.display = 'flex'; $('#pM').textContent = ''; step('사진 여는 중…', 2);
  ['proj','pn','qty','ven'].forEach(k => setField(k, '')); showCands([]); showProjAlt([]); Object.assign(ctx, { pur:'', a:{}, sent:'' }); refresh();
  $('#bCam').disabled = $('#bAlb').disabled = true;
  const t0 = performance.now();
  onOcrProg = m => { if (m.status === 'loading language traineddata' && m.progress < 1) $('#pM').textContent = '인식 도구 내려받는 중 ' + Math.round(m.progress*100) + '%'; };
  try {
    const r = await recognize(file);
    window.__last = r;
    if (r.pn) setField('pn', r.pn.pn, r.pn.check || !r.pn.known ? 'chk' : 'auto', r.via === 'QR' ? (r.pn.known ? 'QR 인식' : 'QR · 목록에 없음') : (!r.pn.known ? '목록에 없음 · 확인 필요' : r.pn.check ? '확인 필요' : '자동 인식'));
    if (r.pn && r.cands.length) $('#cPn').innerHTML = '<span class="mut" style="width:100%">비슷한 품번:</span>' + r.cands.map(c => `<button class="chip" type="button" data-pn="${esc(c.pn)}">${esc(c.pn)}<small>${esc(fmtName(c.name))}</small></button>`).join('');
    if (!r.pn) showCands(r.cands);
    if (r.proj) setField('proj', r.proj.name, r.proj.check ? 'chk' : 'auto', r.proj.check ? '확인 필요' : '자동 인식');
    showProjAlt(r.projAlt || []);
    if (r.qty) setField('qty', r.qty, 'auto', '자동 인식');
    if (r.ven) setField('ven', r.ven.name, r.ven.s >= 1 ? 'auto' : 'chk', r.ven.s >= 1 ? '자동 인식' : '확인 필요');
    Object.assign(ctx, { pur:r.pur || '', a:{ proj:r.proj?.name || '', pn:r.pn?.pn || '', ven:r.ven?.name || '', qty:r.qty || '' }, sent:'' });
    applyLearn({ proj: !r.proj || r.proj.check, ven: !r.ven || r.ven.s < 1 });
    const got = [r.proj && '프로젝트', r.pn && '품번', r.qty && '수량', r.ven && '귀책'].filter(Boolean);
    step(got.length ? '인식 완료' : '읽은 내용이 없어요. 직접 입력해 주세요.', 100);
    $('#pM').textContent = (r.drawing ? '도면 사진 · ' : '') + (got.length ? got.join(', ') + ' 채움' : '') + ` · ${((performance.now()-t0)/1000).toFixed(1)}초`
      + (r.drawing ? ' · 도면에는 프로젝트·수량·귀책이 없어 직접 입력해 주세요' : '');
    refresh();
    if (!clean(F.txt.value)) F.txt.focus({ preventScroll:true });
  } catch(e) {
    console.error(e); step('인식 실패: ' + (e.message || e), 100); $('#pM').textContent = '인터넷 연결을 확인하거나 직접 입력해 주세요.';
  } finally {
    $('#bCam').disabled = $('#bAlb').disabled = false; onOcrProg = null;
  }
}
for (const [b, f] of [['#bCam','#fCam'],['#bAlb','#fAlb']]) {
  $(b).addEventListener('click', () => { $(f).value = ''; $(f).click(); for (let i=0;i<PAR;i++) ocrWorker(i).catch(()=>{}); zx().catch(()=>{}); });   // 고르는 동안 도구를 미리 받기 시작
  $(f).addEventListener('change', e => onFile(e.target.files[0]));
}
$('#bNew').addEventListener('click', () => { Object.keys(F).forEach(k => setField(k, '')); Object.assign(ctx, { pur:'', a:{}, sent:'' }); showCands([]); showProjAlt([]); $('#shot').style.display = 'none'; refresh(); F.proj.focus(); });

/* 검색 드롭다운 (초성 검색 지원) */
function matchScore(q, s, pre){
  const l = pre ? pre.l : s.toLowerCase(), c = pre ? pre.c : choseong(l);
  if (l.startsWith(q.l)) return 5; if (l.includes(q.l)) return 4;
  if (q.n.length >= 3 && normC(s).includes(q.n)) return 3;
  if (q.c && c.startsWith(q.c)) return 2; if (q.c && c.includes(q.c)) return 1; return 0;
}
// 초성을 연달아 치면 휴대폰 자판이 ㄱ+ㅅ을 ㄳ으로 합쳐버림
// → 품질팀 변환기와 같은 방식: 바로 ㄱㅅ으로 풀고 입력을 확정(다음 초성이 새로 입력되게)
function unjoinJamo(input){
  input.addEventListener('input', () => {
    if (!/[ㄳㄵㄶㄺㄻㄼㄽㄾㄿㅀㅄ]/.test(input.value)) return;
    input._keep = true; input.value = splitJamo(input.value); input.blur(); input.focus(); input._keep = false;
    const n = input.value.length; try { input.setSelectionRange(n, n); } catch(_) {}
  });
}
// 품질팀 변환기의 귀책·발견자 검색 조건 그대로 (vendorMatches / nameMatches)
//   앞글자 일치 4 > 포함 3 > 초성 앞 일치 2 > 초성 포함 1, 같은 점수는 가나다순, 최대 30개
function nameScore(q, name){
  const qq = clean(splitJamo(q)).toLowerCase(), qc = choseong(qq);
  const n = name.toLowerCase(), c = choseong(n);
  if (!qq) return 1; if (n.startsWith(qq)) return 4; if (n.includes(qq)) return 3; if (c.startsWith(qc)) return 2; if (c.includes(qc)) return 1; return 0;
}
const byName = list => q => list().map(x => ({ x, s:nameScore(q, x.v) })).filter(o => o.s >= 1).sort((a,b) => b.s - a.s || ko(a.x.v, b.x.v)).slice(0, 30).map(o => o.x);
// 프로젝트·품번 검색 (품번은 O↔0 같은 헷갈리는 글자도 찾음)
const byCode = list => q => {
  const raw = splitJamo(clean(q)); const qq = { l: raw.toLowerCase(), n: normC(raw), c: /[ㄱ-ㅎ]/.test(raw) ? choseong(raw.toLowerCase()) : '' };
  const all = list();
  return !raw ? all.slice(0, 30) : all.map(x => ({ x, s: Math.max(matchScore(qq, x.v, x._v ||= { l:x.v.toLowerCase(), c:choseong(x.v.toLowerCase()) }), x.sub ? matchScore(qq, x.sub) - 1 : 0) })).filter(o => o.s > 0)
    .sort((a,b) => b.s - a.s || ko(a.x.v, b.x.v)).slice(0, 30).map(o => o.x);
};
function combo(input, dd, search, onPick, empty){
  let act = 0, items = [];
  unjoinJamo(input);
  const mark = () => [...dd.querySelectorAll('[data-i]')].forEach((d,i) => d.classList.toggle('act', i === act));
  const show = () => {
    items = search(input.value); act = 0;
    dd.innerHTML = items.map((x,i) => `<div data-i="${i}"><span>${esc(x.v)}</span>${x.sub ? `<small>${esc(x.sub)}</small>` : ''}</div>`).join('')
      || (empty && clean(input.value) ? `<div><small>${empty}</small></div>` : '');
    mark();   // 첫 항목을 미리 선택 → Enter로 바로 고름
    dd.style.display = dd.innerHTML && document.activeElement === input ? 'block' : 'none';
  };
  const pick = i => { if (!items[i]) return; input.value = items[i].v; dd.style.display = 'none'; onPick && onPick(items[i]); refresh(); };
  input.addEventListener('input', () => { show(); refresh(); });
  input.addEventListener('focus', show);
  input.addEventListener('blur', () => { if (input._keep) return; setTimeout(() => { if (document.activeElement !== input) dd.style.display = 'none'; }, 150); });
  input.addEventListener('keydown', e => {
    if (dd.style.display !== 'block') return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); if (!items.length) return;
      act = (act + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length; mark(); dd.querySelectorAll('[data-i]')[act]?.scrollIntoView({ block:'nearest' }); }
    else if (e.key === 'Enter') { if (items.length) { e.preventDefault(); pick(act); } }
    else if (e.key === 'Escape') dd.style.display = 'none';
  });
  dd.addEventListener('mousedown', e => { const d = e.target.closest('[data-i]'); if (d) { e.preventDefault(); pick(+d.dataset.i); } });
}
let srcProj = null, srcPn = null, srcVen = null;
combo(F.proj, $('#dProj'), byCode(() => srcProj ||= S.proj.map(p => ({ v:p.name, sub:p.type }))));
combo(F.pn, $('#dPn'), byCode(() => srcPn ||= [...S.parts.values()].map(p => ({ v:p.pn, sub:fmtName(p.name) }))), () => { showCands([]); applyLearn({ proj:false, ven:false }); });
combo(F.ven, $('#dVen'), byName(() => srcVen ||= S.vendors.map(v => ({ v:v.name, sub:v.big }))), null, '결과 없음');
combo(F.req, $('#dReq'), byName(() => S.finders.map(n => ({ v:n }))), null, '명단에 없음 — 그대로 입력돼요');
// 요청자는 기억하지 않음: 휴대폰을 여러 명이 같이 쓰므로 항상 빈칸에서 초성 검색으로 고름 (예전에 저장된 값은 지움)
try { localStorage.removeItem('dl_req'); } catch(e) {}
F.qty.addEventListener('input', refresh); F.txt.addEventListener('input', refresh);

/* 복사 */
async function copyText(t){
  try { await navigator.clipboard.writeText(t); return true; } catch(e) {}
  const ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
  let ok = false; try { ok = document.execCommand('copy'); } catch(e) {} ta.remove(); return ok;
}
$('#bCopy').addEventListener('click', async () => { refresh(); const t = $('#out').textContent; recordCopy(); toast(await copyText(t) ? '복사했어요' : '복사하지 못했어요. 길게 눌러 복사해 주세요'); });
// 품번을 직접 고르거나 고치면: 비어 있는 프로젝트·귀책을 이전 기록으로 채움
F.pn.addEventListener('change', () => { const u = applyLearn({ proj:false, ven:false }); if (u.length) refresh(); });

refresh();
loadAll().then(() => { srcProj = srcPn = srcVen = null; refresh(); });
loadLearn();
addEventListener('online', flushLearn);

/* ================== 앱으로 설치 ================== */
// 저장 스크립트: 인식 도구를 휴대폰에 저장 (구글시트는 저장하지 않아 항상 실시간)
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost') && !QS.get('lib'))
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
(() => {
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  if (standalone || store.get('dl_inst_x', 0) > Date.now()) return;   // 이미 설치했거나, 닫은 지 30일 안 됨
  const ua = navigator.userAgent, bar = $('#inst'), show = html => { $('#instT').innerHTML = html; bar.classList.add('on'); };
  $('#instX').addEventListener('click', () => { bar.classList.remove('on'); store.set('dl_inst_x', Date.now() + 30*864e5); });
  if (/KAKAOTALK|NAVER|Line\/|Instagram|FBAN|FBAV/i.test(ua)) {   // 메신저 안 브라우저는 설치가 안 됨
    show(/iPhone|iPad/.test(ua) ? '앱으로 설치하려면 <b>사파리로 열기</b> 후 공유 → <b>홈 화면에 추가</b>'
                                : '앱으로 설치하려면 오른쪽 위 <b>⋮ → 다른 브라우저로 열기</b>(크롬)'); return; }
  if (/iPhone|iPad/.test(ua)) { show('홈 화면에 추가하면 앱처럼 쓸 수 있어요: 아래 <b>공유</b> 버튼 → <b>홈 화면에 추가</b>'); return; }
  let ev = null;   // 안드로이드 크롬·삼성 인터넷: 설치 창을 바로 띄울 수 있음
  addEventListener('beforeinstallprompt', e => { e.preventDefault(); ev = e; $('#instGo').hidden = false; show('홈 화면에 <b>앱으로 설치</b>하면 바로 열 수 있어요'); });
  $('#instGo').addEventListener('click', async () => { if (!ev) return; ev.prompt(); const r = await ev.userChoice.catch(() => null); ev = null;
    bar.classList.remove('on'); if (r && r.outcome === 'accepted') toast('설치했어요. 홈 화면 아이콘으로 열 수 있어요'); });
  addEventListener('appinstalled', () => bar.classList.remove('on'));
})();
// 사진을 고르기 전에 인식 도구를 미리 준비 (첫 사진 대기 시간 단축)
setTimeout(() => { zx().catch(() => {}); for (let i=0;i<PAR;i++) ocrWorker(i).catch(() => {}); }, 300);
</script>
