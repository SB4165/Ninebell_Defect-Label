<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f6f8fa">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="부적합 처리">
<title>부적합 처리</title>
<!--
  부적합 처리 — 팀 통합 화면 (제조팀 · 품질팀 · 구매팀)
  - 위쪽 공통 머리글(로고 · '부적합 처리' · 팀 선택)만 이 파일이 그림
  - 팀 화면은 각 팀 사이트를 안쪽 창(iframe)으로 불러오고, 팀 화면의 머리글만 숨김 (팀 사이트 코드는 그대로)
      제조팀: ./mfg/   품질팀: /Ninebell_Defect-Data-Upload/   구매팀: /Ninebell_Defect-Purchase/
  - 같은 주소(sb4165.github.io)라서 저장값(요청자·비밀번호 등)은 기존 사이트와 그대로 공유됨
  - 기본 팀: 처음 = 제조팀, 이후 = 이 기기에서 마지막으로 고른 팀 (localStorage 'nb_team')
  - 주소로 바로 열기: ?team=mfg | qa | pur  (그 밖의 ?mock=1 등은 팀 화면에 그대로 전달)
-->
<style>
:root{
  --bg:#ffffff; --bg2:#f6f8fa; --bd:#d0d7de; --fg:#1f2328; --mut:#59636e;
  --acc:#0969da; --ok:#1a7f37; --btn:#1f883d; --err:#d1242f;
}
html{color-scheme:only light}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Malgun Gothic",Helvetica,Arial,sans-serif;
  display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
header{flex:none;background:var(--bg2);border-bottom:1px solid var(--bd);padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));position:relative;z-index:20}
.hwrap{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-weight:600;font-size:16px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.logo .wm{height:18px;width:auto;display:block}
.logo .lsep{width:1px;height:16px;background:var(--bd);margin:0 2px}
.team{position:relative}
.tbtn{font:inherit;font-size:15px;font-weight:600;color:var(--fg);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:3px 8px 3px 12px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap}
.tbtn:hover{border-color:var(--mut)}
.tbtn svg{transition:transform .15s;color:var(--mut)}
.team.open .tbtn svg{transform:rotate(180deg)}
.tmenu{position:absolute;left:0;top:calc(100% + 6px);min-width:150px;background:var(--bg);border:1px solid var(--bd);border-radius:12px;box-shadow:0 8px 24px rgba(31,35,40,.12);padding:6px;display:none}
.team.open .tmenu{display:block}
.tmenu button{display:flex;align-items:center;gap:8px;width:100%;font:inherit;font-size:14px;text-align:left;background:none;border:0;border-radius:8px;padding:8px 10px;cursor:pointer;color:var(--mut)}
.tmenu button:hover{background:var(--bg2)}
.tmenu button .ck{width:16px;color:var(--acc);visibility:hidden}
.tmenu button.on{color:var(--fg);font-weight:600}
.tmenu button.on .ck{visibility:visible}
.status{margin-left:auto;font-size:12px;color:var(--mut);display:flex;gap:6px;flex-wrap:wrap}
.pill{border:1px solid var(--bd);border-radius:2em;padding:0 8px;background:var(--bg)}
.pill.ok{color:var(--ok);border-color:var(--ok)} .pill.err{color:var(--err);border-color:var(--err)}
.btn{font:inherit;font-weight:500;border:1px solid var(--bd);background:var(--bg2);color:var(--fg);border-radius:6px;padding:5px 14px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--mut)}
.btn.sm{padding:2px 10px;font-size:12px}
.instb{display:inline-flex;align-items:center;gap:5px;color:var(--btn);border-color:#9bd2ab;background:#fff}
main{flex:1;position:relative;min-height:0}
main iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:var(--bg)}
main iframe.on{display:block}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:13px;pointer-events:none}
.mbg{position:fixed;inset:0;background:rgba(31,35,40,.45);display:none;align-items:center;justify-content:center;z-index:60;padding:16px}
.mbg.on{display:flex}
.mbox{background:var(--bg);border-radius:12px;max-width:420px;width:100%;padding:18px 18px 14px;box-shadow:0 8px 24px rgba(31,35,40,.2)}
.mbox h3{margin:0 0 8px;font-size:16px}
.mbox ol{margin:6px 0;padding-left:20px} .mbox p{margin:6px 0} .mbox .mut{color:var(--mut);font-size:12px}
.mbox .ft{text-align:right;margin-top:12px}
@media (max-width:760px){
  header{padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top))}
  .hwrap{gap:8px 10px}
  .logo{font-size:15px;gap:6px} .logo .wm{height:13px} .logo .lsep{height:13px}
  .tbtn{font-size:14px;padding:2px 6px 2px 10px}
  .instb{margin-left:auto;order:1;padding:2px 8px}
  .hwrap .status{order:2;margin-left:0;width:100%}
  .hwrap .status:empty{display:none}
}
</style>
</head>
<body>
<header><div class="hwrap">
  <div class="logo"><img class="wm" src="ninebell-logo.png" alt="NINEBELL"><span class="lsep" aria-hidden="true"></span>부적합 처리</div>
  <div class="team" id="team">
    <button type="button" class="tbtn" id="tbtn" aria-haspopup="true" aria-expanded="false"><span id="tname">제조팀</span>
      <svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M12.78 5.22a.749.749 0 0 1 0 1.06l-4.25 4.25a.749.749 0 0 1-1.06 0L3.22 6.28a.749.749 0 1 1 1.06-1.06L8 8.939l3.72-3.719a.749.749 0 0 1 1.06 0Z"/></svg></button>
    <div class="tmenu" id="tmenu" role="menu"></div>
  </div>
  <div class="status" id="status"></div>
  <button type="button" class="btn sm instb" id="bInstall" style="display:none" title="홈 화면·바탕화면에 앱으로 추가">
    <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M2.75 14A1.75 1.75 0 0 1 1 12.25v-2.5a.75.75 0 0 1 1.5 0v2.5c0 .138.112.25.25.25h10.5a.25.25 0 0 0 .25-.25v-2.5a.75.75 0 0 1 1.5 0v2.5A1.75 1.75 0 0 1 13.25 14Z"/><path d="M7.25 7.689V2a.75.75 0 0 1 1.5 0v5.689l1.97-1.969a.749.749 0 1 1 1.06 1.06l-3.25 3.25a.749.749 0 0 1-1.06 0L4.22 6.78a.749.749 0 1 1 1.06-1.06l1.97 1.969Z"/></svg>앱 설치</button>
</div></header>
<main id="main"><div class="loading" id="loading">불러오는 중…</div></main>
<div class="mbg" id="mbg"><div class="mbox"><h3>앱으로 설치하기</h3><div id="mbody"></div><div class="ft"><button type="button" class="btn" id="mok">확인</button></div></div></div>
<script>
'use strict';
const TEAMS = [
  { id:'mfg', name:'제조팀', src:'mfg/' },
  { id:'qa',  name:'품질팀', src:'/Ninebell_Defect-Data-Upload/' },
  { id:'pur', name:'구매팀', src:'/Ninebell_Defect-Purchase/' },
];
const DEF = 'mfg', KEY = 'nb_team';
const $ = s => document.querySelector(s);
const store = { get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:v; }catch(e){ return d; } },
                set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} } };
const byId = id => TEAMS.find(t => t.id === id);

// 주소의 team= 은 이 화면이 쓰고, 나머지(mock 등)는 팀 화면에 넘김
const qs = new URLSearchParams(location.search);
const qTeam = qs.get('team'); qs.delete('team');
const pass = qs.toString();
const frames = {};   // id → { f, status }
let cur = null;

function frameSrc(t){ return t.src + (pass ? (t.src.includes('?') ? '&' : '?') + pass : ''); }

// 팀 화면 안쪽 머리글 숨기기 (같은 주소라 바로 손댈 수 있음)
const HIDE_CSS = 'body>header{display:none!important}';
function tick(){
  for (const id in frames) {
    const fr = frames[id];
    let d; try { d = fr.f.contentDocument; } catch(e) { continue; }
    if (!d || !d.documentElement || d.location.href === 'about:blank') continue;
    if (!d.__nbStyled) {
      const st = d.createElement('style'); st.textContent = HIDE_CSS;
      (d.head || d.documentElement).appendChild(st);
      d.__nbStyled = true;
    }
    const s = d.getElementById('status');
    const html = s ? s.innerHTML : '';
    if (html !== fr.status) { fr.status = html; if (id === cur) $('#status').innerHTML = html; }
  }
}
setInterval(tick, 60);

function makeFrame(t){
  const f = document.createElement('iframe');
  f.title = '부적합 처리 · ' + t.name;
  f.allow = 'camera; microphone; clipboard-read; clipboard-write; fullscreen';
  f.src = frameSrc(t);
  const fr = frames[t.id] = { f, status: '', loaded: false };
  f.addEventListener('load', () => { fr.loaded = true; if (t.id === cur) $('#loading').style.display = 'none'; tick(); });
  $('#main').appendChild(f);
}
function show(id){
  const t = byId(id) || byId(DEF);
  cur = t.id;
  if (!frames[t.id]) makeFrame(t);
  for (const k in frames) frames[k].f.classList.toggle('on', k === t.id);
  $('#loading').style.display = frames[t.id].loaded ? 'none' : '';
  $('#tname').textContent = t.name;
  $('#status').innerHTML = frames[t.id].status;
  document.title = '부적합 처리 · ' + t.name;
  [...$('#tmenu').children].forEach(b => b.classList.toggle('on', b.dataset.id === t.id));
  store.set(KEY, t.id);
  // 주소창에 현재 팀 표시 (새로고침·공유해도 같은 팀)
  const u = new URLSearchParams(pass); u.set('team', t.id);
  try { history.replaceState(null, '', '?' + u.toString() + location.hash); } catch(e) {}
  try { frames[t.id].f.contentWindow.focus(); } catch(e) {}
}

// 팀 선택 메뉴
$('#tmenu').innerHTML = TEAMS.map(t =>
  `<button type="button" role="menuitemradio" data-id="${t.id}"><span class="ck">✓</span>${t.name}</button>`).join('');
const team = $('#team');
function openMenu(on){ team.classList.toggle('open', on); $('#tbtn').setAttribute('aria-expanded', on ? 'true' : 'false'); }
$('#tbtn').addEventListener('click', e => { e.stopPropagation(); openMenu(!team.classList.contains('open')); });
$('#tmenu').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; openMenu(false); if (b.dataset.id !== cur) show(b.dataset.id); });
document.addEventListener('click', e => { if (!team.contains(e.target)) openMenu(false); });
addEventListener('blur', () => setTimeout(() => { if (document.activeElement && document.activeElement.tagName === 'IFRAME') openMenu(false); }, 0));
addEventListener('keydown', e => { if (e.key === 'Escape') openMenu(false); });

show(byId(qTeam) ? qTeam : store.get(KEY, DEF));
// 다른 팀 화면은 처음 고를 때 불러옴 (제조팀 인식 도구 등 큰 파일을 미리 받지 않도록). 한 번 연 팀은 바꿔도 입력 상태 유지

/* ===== 웹앱 설치 (팀 화면 안쪽 설치 버튼 대신 여기서) ===== */
const PWA = { prompt: null };
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const UA = navigator.userAgent || '';
const isIOS = /iPhone|iPad|iPod/.test(UA) || (/Mac/.test(navigator.platform || '') && navigator.maxTouchPoints > 1);
const inApp = /KAKAOTALK|NAVER|Line\/|FBAN|FBAV|Instagram|DaumApps|; wv\)|Whale\/.*Mobile.*inapp/i.test(UA);
function showInstall(){ $('#bInstall').style.display = isStandalone() ? 'none' : ''; }
addEventListener('beforeinstallprompt', e => { e.preventDefault(); PWA.prompt = e; showInstall(); });
addEventListener('appinstalled', () => { PWA.prompt = null; $('#bInstall').style.display = 'none'; });
$('#bInstall').onclick = async () => {
  if (PWA.prompt) { const p = PWA.prompt; PWA.prompt = null; p.prompt(); try { await p.userChoice; } catch(e) {} return; }
  $('#mbody').innerHTML = (inApp
    ? `<p>지금은 메신저 안에서 열려 있어 설치할 수 없어요.</p><ol><li>오른쪽 위(또는 아래) 메뉴 <b>⋮ / ···</b></li><li><b>다른 브라우저로 열기</b> (사파리·크롬)</li><li>열린 화면에서 다시 <b>[앱 설치]</b></li></ol>`
    : isIOS
    ? `<p>아이폰·아이패드는 <b>사파리</b>에서 추가해요.</p><ol><li>아래쪽(아이패드는 위쪽) <b>공유 버튼</b> ⬆︎</li><li><b>홈 화면에 추가</b></li><li>오른쪽 위 <b>추가</b></li></ol>`
    : `<p>브라우저 메뉴에서 추가해요.</p><ol><li><b>크롬·엣지 (PC)</b>: 주소창 오른쪽의 설치 아이콘, 또는 메뉴 <b>⋮</b> → <b>앱 설치</b></li><li><b>안드로이드 크롬·삼성 인터넷</b>: 메뉴 <b>⋮ / ≡</b> → <b>홈 화면에 추가</b> 또는 <b>앱 설치</b></li></ol><p class="mut">설치 메뉴가 안 보이면 새로고침한 뒤 다시 눌러 주세요.</p>`)
    + `<p class="mut">설치하면 홈 화면 아이콘으로 바로 열려요. 팀은 위쪽에서 바꿀 수 있어요.</p>`;
  $('#mbg').classList.add('on');
};
$('#mok').onclick = () => $('#mbg').classList.remove('on');
$('#mbg').addEventListener('click', e => { if (e.target.id === 'mbg') $('#mbg').classList.remove('on'); });
if (!isStandalone() && (isIOS || inApp || !('BeforeInstallPromptEvent' in window))) showInstall();
if ('serviceWorker' in navigator && location.protocol === 'https:') addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
</html>
